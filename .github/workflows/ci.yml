name: CI Build

on:
  push:
    branches: ["main", "sowavy234-upgraded-broccoli"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt || true

      - name: Lint / Test backend (placeholder)
        run: |
          echo "No backend tests configured; skipping"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build frontend
        working-directory: frontend
        run: pnpm build || echo "No build script found; skipping"

      - name: Archive frontend build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/.next || frontend/build || frontend/dist || frontend/out || frontend/public
